name: probe
on:
  push:
    branches: [ 'arena/**' ]
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: dotnet info
        shell: pwsh
        run: |
          dotnet --info
          Write-Host "Session: $env:SESSIONNAME  User: $env:USERNAME"
          Add-Type -AssemblyName System.Windows.Forms
          $s = [System.Windows.Forms.Screen]::PrimaryScreen
          Write-Host "Screen: $($s.Bounds)"
